services:
  n8n:
    depends_on:
      jaeger:
        condition: service_healthy
    environment:
      N8N_OTEL_ENABLED: "true"
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"
      N8N_OTEL_TRACES_INCLUDE_NODE_SPANS: "true"
      N8N_OTEL_TRACES_INJECT_OUTBOUND: "true"
      N8N_OTEL_TRACES_SAMPLE_RATE: "1"

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    restart: unless-stopped
    ports:
      - 127.0.0.1:16686:16686
    expose:
      - "4318"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:13133/status
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
